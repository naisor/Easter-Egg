<head>

    <title>Bienvenido al Easter Egg</title>
    <style>
        body {

            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .card { 
            background: #1e293b; 
            padding: 2rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            text-align: center;
        }
        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #f8fafc;
        }
        .banner-img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0.5rem;
            text-align: left;
        }
        p {
            text-align: left;
        }
        input, textarea { 
            width: 100%; 
            padding: 0.75rem; 
            margin: 0.5rem 0 1rem 0; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #fff; 
            border-radius: 0.5rem; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        button { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 0.5rem; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1rem;
            transition: background 0.2s;
            margin-bottom: 0.5rem;
        }
        button:hover { 
            background: #2563eb; 
        }
        .btn-secondary {
            background: #334155;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .link-box { 
            background: #0f172a; 
            padding: 0.75rem; 
            border-radius: 0.5rem; 
            word-break: break-all; 
            font-family: monospace; 
            font-size: 0.85rem; 
            color: #38bdf8; 
            margin: 1rem 0; 
            text-align: left;
        }
        .hidden { 
            display: none !important; 
        }
    </style>
</head>
