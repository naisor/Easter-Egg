<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido al Easter Egg</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .card { 
            background: #1e293b; 
            padding: 2rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            text-align: center;
        }
        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #f8fafc;
        }
        .banner-img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
            display: block;
        }
        h2 {
            font-size: 1.3rem;
            margin-top: 0.5rem;
            text-align: left;
        }
        p {
            text-align: left;
        }
        input, textarea { 
            width: 100%; 
            padding: 0.75rem; 
            margin: 0.5rem 0 1rem 0; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #fff; 
            border-radius: 0.5rem; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        button { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 0.5rem; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            font-size: 1rem;
            transition: background 0.2s;
            margin-bottom: 0.5rem;
        }
        button:hover { 
            background: #2563eb; 
        }
        .btn-secondary {
            background: #334155;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .link-box { 
            background: #0f172a; 
            padding: 0.75rem; 
            border-radius: 0.5rem; 
            word-break: break-all; 
            font-family: monospace; 
            font-size: 0.85rem; 
            color: #38bdf8; 
            margin: 1rem 0; 
            text-align: left;
        }
        .hidden { 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bienvenido al Easter Egg 🥚✨</h1>
        
        <!-- Imagen Banner fija -->
        <img 
            src="https://lh3.googleusercontent.com/pw/AP1GczOCuDpgbjBqu9fzZPprtcAoCgWGCkazAJdGLfL2ctx7yJOPaE7ue51u4t62SPHWpUUiyeOMlo7ALoUsZ5VNiqMIuc-A7MeM0gqSQtTSebDl6HhMmUX4E9tGmZWUuFF1rbeLNJ20_cMl_Nak1XVo16qTWw=w896-h1195-s-no?authuser=0" 
            alt="Easter Egg Banner" 
            class="banner-img"
        >

        <!-- Pantalla 1: Crear o Sobrescribir Pregunta -->
        <div id="pantalla-crear">
            <h2>Crea tu pregunta 📝</h2>
            <p style="font-size: 0.85rem; color: #94a3b8;">Escribe tu pregunta para compartirla.</p>
            
            <input type="text" id="input-pregunta" placeholder="Ej: ¿Qué opinas de mí?" autocomplete="off">
            <button id="btn-crear" onclick="crearOReemplazarPregunta()">Crear / Actualizar Pregunta</button>
            <button id="btn-ver-estado" class="btn-secondary" onclick="verEstado()">Ver respuesta actual</button>
        </div>

        <!-- Pantalla 2: Enlace Listo -->
        <div id="pantalla-enlace" class="hidden">
            <h2>¡Enlace listo! 🚀</h2>
            <p>Comparte este enlace para que te respondan:</p>
            <div class="link-box" id="texto-enlace"></div>
            <button onclick="verEstado()">Ver estado / Respuesta</button>
            <button class="btn-secondary" onclick="irACrearNueva()">Volver a Crear</button>
        </div>

        <!-- Pantalla 3: La otra persona responde -->
        <div id="pantalla-responder" class="hidden">
            <h2>Responde la pregunta 🤔</h2>
            <p id="pregunta-texto" style="font-size: 1.1rem; color: #38bdf8;">Cargando pregunta...</p>
            <textarea id="input-respuesta" rows="3" placeholder="Escribe tu respuesta aquí..."></textarea>
            <button id="btn-enviar-resp" onclick="enviarRespuesta()">Enviar respuesta</button>
        </div>

        <!-- Pantalla 4: Éxito al responder -->
        <div id="pantalla-exito" class="hidden">
            <h2>¡Enviado con éxito! 🎉</h2>
            <p>Tu respuesta ha sido guardada.</p>
        </div>

        <!-- Pantalla 5: Ver la respuesta -->
        <div id="pantalla-resultado" class="hidden">
            <h2>Estado de la pregunta 🎯</h2>
            <p id="pregunta-mostrada"></p>
            <div class="link-box" id="caja-respuesta" style="color: #4ade80;">Cargando...</div>
            <button onclick="irACrearNueva()">Crear una nueva pregunta</button>
        </div>
    </div>

    <script>
        const ORIGEN = window.location.origin;
        const urlParams = new URLSearchParams(window.location.search);
        const modoResponder = urlParams.get('responder') === 'true';

        function cambiarPantalla(idMostrar) {
            const pantallas = ['pantalla-crear', 'pantalla-enlace', 'pantalla-responder', 'pantalla-exito', 'pantalla-resultado'];
            pantallas.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id === idMostrar) {
                        el.classList.remove('hidden');
                    } else {
                        el.classList.add('hidden');
                    }
                }
            });
        }

        async function inicializar() {
            if (modoResponder) {
                cambiarPantalla('pantalla-responder');
                cargarPreguntaParaResponder();
            } else {
                cambiarPantalla('pantalla-crear');
            }
        }

        async function cargarPreguntaParaResponder() {
            try {
                const res = await fetch(`${ORIGEN}/api/pregunta?t=${Date.now()}`);
                const data = await res.json();
                if (res.ok && data.pregunta) {
                    document.getElementById('pregunta-texto').innerText = data.pregunta;
                } else {
                    document.getElementById('pregunta-texto').innerText = "No hay ninguna pregunta activa en este momento.";
                }
            } catch (e) {
                document.getElementById('pregunta-texto').innerText = "Error al conectar con el servidor.";
            }
        }

        async function crearOReemplazarPregunta() {
            const input = document.getElementById('input-pregunta');
            const pregunta = input ? input.value.trim() : '';
            
            if (!pregunta) {
                alert('Por favor, escribe una pregunta antes de continuar.');
                return;
            }

            const btn = document.getElementById('btn-crear');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "Guardando...";
            }

            try {
                const res = await fetch(`${ORIGEN}/api/pregunta`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ accion: 'crear', pregunta: pregunta })
                });

                const text = await res.text();
                let data = {};
                try { data = JSON.parse(text); } catch(err) {}

                if (res.ok) {
                    const enlace = `${ORIGEN}${window.location.pathname}?responder=true`;
                    const boxEnlace = document.getElementById('texto-enlace');
                    if (boxEnlace) boxEnlace.innerText = enlace;
                    cambiarPantalla('pantalla-enlace');
                } else {
                    alert('Error al guardar: ' + (data.error || text || 'Error desconocido en el servidor.'));
                }
            } catch (e) {
                alert('Error de conexión al servidor: ' + e.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Crear / Actualizar Pregunta";
                }
            }
        }

        async function verEstado() {
            const btn = document.getElementById('btn-ver-estado');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "Consultando...";
            }

            try {
                const res = await fetch(`${ORIGEN}/api/pregunta?t=${Date.now()}`);
                const text = await res.text();
                let contenido = {};
                try { contenido = JSON.parse(text); } catch(err) {}

                if (!res.ok || !contenido.pregunta) {
                    alert("Aún no se ha creado ninguna pregunta o el servidor devolvió una respuesta vacía.");
                    return;
                }

                cambiarPantalla('pantalla-resultado');

                const pMostrada = document.getElementById('pregunta-mostrada');
                if (pMostrada) {
                    pMostrada.innerHTML = `<strong>Tu pregunta:</strong> ${contenido.pregunta}`;
                }
                
                const cajaResp = document.getElementById('caja-respuesta');
                if (cajaResp) {
                    if (contenido.respondido) {
                        cajaResp.innerHTML = `<strong>Respuesta recibida:</strong> ${contenido.respuesta}`;
                    } else {
                        const enlaceResponder = `${ORIGEN}${window.location.pathname}?responder=true`;
                        cajaResp.innerHTML = `<em>Aún no hay respuesta... Comparte tu enlace:<br><a href="${enlaceResponder}" target="_blank" style="color: #38bdf8;">${enlaceResponder}</a></em>`;
                    }
                }
            } catch (e) {
                alert("Error al obtener el estado: " + e.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Ver respuesta actual";
                }
            }
        }

        async function enviarRespuesta() {
            const input = document.getElementById('input-respuesta');
            const respuesta = input ? input.value.trim() : '';
            if (!respuesta) return alert('Escribe una respuesta.');

            const btn = document.getElementById('btn-enviar-resp');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "Enviando...";
            }

            try {
                const res = await fetch(`${ORIGEN}/api/pregunta`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ accion: 'responder', respuesta: respuesta })
                });

                const text = await res.text();
                let data = {};
                try { data = JSON.parse(text); } catch(err) {}

                if (res.ok) {
                    cambiarPantalla('pantalla-exito');
                } else {
                    alert('Error al responder: ' + (data.error || text || 'No se pudo guardar.'));
                }
            } catch (e) {
                alert('Error de conexión: ' + e.message);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "Enviar respuesta";
                }
            }
        }

        function irACrearNueva() {
            cambiarPantalla('pantalla-crear');
        }

        document.addEventListener('DOMContentLoaded', inicializar);
    </script>
</body>
</html>
