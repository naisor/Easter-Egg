<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pregunta Secreta</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2563eb; }
        .link-box { background: #0f172a; padding: 0.75rem; border-radius: 0.5rem; word-break: break-all; font-family: monospace; font-size: 0.85rem; color: #38bdf8; margin: 1rem 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Pantalla 1: Crear o Sobrescribir Pregunta -->
        <div id="pantalla-crear" class="hidden">
            <h2>Crea tu pregunta 📝</h2>
            <p style="font-size: 0.85rem; color: #94a3b8;">Esto reemplazará cualquier pregunta anterior.</p>
            <input type="text" id="input-pregunta" placeholder="Ej: ¿Qué opinas de mí?" autocomplete="off">
            <button onclick="crearOReemplazarPregunta()">Crear / Actualizar Pregunta</button>
        </div>

        <!-- Pantalla 2: Enlace Listo -->
        <div id="pantalla-enlace" class="hidden">
            <h2>¡Enlace listo! 🚀</h2>
            <p>Comparte este enlace para que te respondan:</p>
            <div class="link-box" id="texto-enlace"></div>
            <button onclick="verEstado()">Ver estado / Respuesta</button>
        </div>

        <!-- Pantalla 3: La otra persona responde -->
        <div id="pantalla-responder" class="hidden">
            <h2>Responde la pregunta 🤔</h2>
            <p id="pregunta-texto" style="font-size: 1.1rem; color: #38bdf8; Carga..."></p>
            <textarea id="input-respuesta" rows="3" placeholder="Escribe tu respuesta aquí..."></textarea>
            <button onclick="enviarRespuesta()">Enviar respuesta</button>
        </div>

        <!-- Pantalla 4: Éxito -->
        <div id="pantalla-exito" class="hidden">
            <h2>¡Enviado con éxito! 🎉</h2>
            <p>Tu respuesta ha sido guardada para Naisor.</p>
        </div>

        <!-- Pantalla 5: Ver la respuesta -->
        <div id="pantalla-resultado" class="hidden">
            <h2>Estado de la pregunta 🎯</h2>
            <p id="pregunta-mostrada"></p>
            <div class="link-box" id="caja-respuesta" style="color: #4ade80;"></div>
            <button onclick="irACrearNueva()">Crear una nueva pregunta (Reemplazar)</button>
        </div>
    </div>

    <script>
        // Usamos una API en la nube pública y gratuita para sincronizar la pregunta entre dispositivos al instante
        const BIN_ID = "65e9b817ef36d10f82d22f6a"; // ID único persistente en la nube
        const API_URL = `https://json.extendsclass.com/bin/${BIN_ID}`;

        const urlParams = new URLSearchParams(window.location.search);
        const modoResponder = urlParams.get('responder') === 'true';

        async function inicializar() {
            if (modoResponder) {
                document.getElementById('pantalla-responder').classList.remove('hidden');
                await cargarPreguntaParaResponder();
            } else {
                verEstado();
            }
        }

        async function cargarPreguntaParaResponder() {
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('pregunta-texto').innerText = data.pregunta || "No hay pregunta activa";
                } else {
                    document.getElementById('pregunta-texto').innerText = "¿Qué opinas de mí?";
                }
            } catch (e) {
                document.getElementById('pregunta-texto').innerText = "¿Qué opinas de mí?";
            }
        }

        async function crearOReemplazarPregunta() {
            const pregunta = document.getElementById('input-pregunta').value.trim();
            if (!pregunta) return alert('Escribe una pregunta');

            const payloadJson = {
                pregunta: pregunta,
                respuesta: "",
                respondido: false
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payloadJson)
                });

                if (res.ok) {
                    const enlace = `${window.location.origin}${window.location.pathname}?responder=true`;
                    document.getElementById('texto-enlace').innerText = enlace;
                    document.getElementById('pantalla-crear').classList.add('hidden');
                    document.getElementById('pantalla-enlace').classList.remove('hidden');
                } else {
                    alert('Error al guardar la pregunta en la nube.');
                }
            } catch (e) {
                alert('Error de red.');
            }
        }

        async function verEstado() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) {
                    document.getElementById('pantalla-crear').classList.remove('hidden');
                    return;
                }

                const contenido = await res.json();
                if (!contenido || !contenido.pregunta) {
                    document.getElementById('pantalla-crear').classList.remove('hidden');
                    return;
                }

                document.getElementById('pantalla-crear').classList.add('hidden');
                document.getElementById('pantalla-enlace').classList.add('hidden');
                document.getElementById('pantalla-resultado').classList.remove('hidden');

                document.getElementById('pregunta-mostrada').innerHTML = `<strong>Tu pregunta:</strong> ${contenido.pregunta}`;
                
                if (contenido.respondido) {
                    document.getElementById('caja-respuesta').innerHTML = `<strong>Respuesta recibida:</strong> ${contenido.respuesta}`;
                } else {
                    const enlaceResponder = `${window.location.origin}${window.location.pathname}?responder=true`;
                    document.getElementById('caja-respuesta').innerHTML = `<em>Aún no hay respuesta... Tu enlace para compartir es: <br><a href="${enlaceResponder}" target="_blank" style="color: #38bdf8;">${enlaceResponder}</a></em>`;
                }
            } catch (e) {
                document.getElementById('pantalla-crear').classList.remove('hidden');
            }
        }

        async function enviarRespuesta() {
            const respuesta = document.getElementById('input-respuesta').value.trim();
            if (!respuesta) return alert('Escribe una respuesta');

            try {
                const resGet = await fetch(API_URL);
                let contenido = resGet.ok ? await resGet.json() : {};

                contenido.respuesta = respuesta;
                contenido.respondido = true;

                const resPut = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(contenido)
                });

                if (resPut.ok) {
                    document.getElementById('pantalla-responder').classList.add('hidden');
                    document.getElementById('pantalla-exito').classList.remove('hidden');
                } else {
                    alert('No se pudo enviar la respuesta.');
                }
            } catch (e) {
                alert('Error al enviar.');
            }
        }

        async function irACrearNueva() {
            // Limpia la nube para dejar listo otra pregunta
            await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pregunta: "", respuesta: "", respondido: false })
            });

            document.getElementById('pantalla-resultado').classList.add('hidden');
            document.getElementById('pantalla-crear').classList.remove('hidden');
        }

        inicializar();
    </script>
</body>
</html>
