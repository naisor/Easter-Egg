<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pregunta Secreta</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2563eb; }
        .link-box { background: #0f172a; padding: 0.75rem; border-radius: 0.5rem; word-break: break-all; font-family: monospace; font-size: 0.85rem; color: #38bdf8; margin: 1rem 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Pantalla 1: Crear Pregunta -->
        <div id="pantalla-crear" class="hidden">
            <h2>Crea tu pregunta 📝</h2>
            <p style="font-size: 0.85rem; color: #94a3b8;">Escribe lo que quieras preguntar.</p>
            <input type="text" id="input-pregunta" placeholder="Ej: ¿Qué opinas de mí?" autocomplete="off">
            <button onclick="generarEnlace()">Generar Enlace</button>
        </div>

        <!-- Pantalla 2: Enlace Listo -->
        <div id="pantalla-enlace" class="hidden">
            <h2>¡Enlace listo! 🚀</h2>
            <p>Comparte este enlace:</p>
            <div class="link-box" id="texto-enlace"></div>
            <button onclick="location.reload()">Crear otra</button>
        </div>

        <!-- Pantalla 3: La otra persona responde -->
        <div id="pantalla-responder" class="hidden">
            <h2>Responde la pregunta 🤔</h2>
            <p id="pregunta-texto" style="font-size: 1.1rem; color: #38bdf8;"></p>
            <textarea id="input-respuesta" rows="3" placeholder="Escribe tu respuesta aquí..."></textarea>
            <button onclick="enviarRespuestaURL()">Enviar respuesta</button>
        </div>

        <!-- Pantalla 4: Éxito al responder -->
        <div id="pantalla-exito" class="hidden">
            <h2>¡Enviado con éxito! 🎉</h2>
            <p>Tu respuesta ha sido generada. Cópiala y envíasela a Naisor.</p>
            <div class="link-box" id="enlace-respuesta-final"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const qParam = urlParams.get('q');
        const rParam = urlParams.get('r');

        function inicializar() {
            if (rParam) {
                // Si trae respuesta, muestra la pantalla de éxito con la respuesta ya lista para ti
                document.getElementById('pantalla-exito').classList.remove('hidden');
                let preguntaOriginal = qParam ? decodeURIComponent(escape(atob(qParam))) : "";
                document.getElementById('enlace-respuesta-final').innerHTML = `<strong>Pregunta:</strong> ${preguntaOriginal}<br><br><strong style="color: #4ade80;">Respuesta:</strong> ${decodeURIComponent(escape(atob(rParam)))}`;
            } else if (qParam) {
                // Si solo trae la pregunta, muestra el formulario para que respondan
                document.getElementById('pantalla-responder').classList.remove('hidden');
                try {
                    const decodificada = decodeURIComponent(escape(atob(qParam)));
                    document.getElementById('pregunta-texto').innerText = decodificada;
                } catch (e) {
                    document.getElementById('pregunta-texto').innerText = qParam;
                }
            } else {
                // Si no hay parámetros, estás tú creando la pregunta
                document.getElementById('pantalla-crear').classList.remove('hidden');
            }
        }

        function generarEnlace() {
            const pregunta = document.getElementById('input-pregunta').value.trim();
            if (!pregunta) return alert('Escribe una pregunta');

            const encoded = btoa(unescape(encodeURIComponent(pregunta)));
            const enlace = `${window.location.origin}${window.location.pathname}?q=${encoded}`;
            
            document.getElementById('texto-enlace').innerText = enlace;
            document.getElementById('pantalla-crear').classList.add('hidden');
            document.getElementById('pantalla-enlace').classList.remove('hidden');
        }

        function enviarRespuestaURL() {
            const respuesta = document.getElementById('input-respuesta').value.trim();
            if (!respuesta) return alert('Escribe una respuesta');

            const encodedResp = btoa(unescape(encodeURIComponent(respuesta)));
            const enlaceFinal = `${window.location.origin}${window.location.pathname}?q=${qParam}&r=${encodedResp}`;

            // Redirige a una vista donde la otra persona solo copia el enlace con su respuesta de vuelta para ti
            window.location.href = enlaceFinal;
        }

        inicializar();
    </script>
</body>
</html>
