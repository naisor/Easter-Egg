<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta Secreta Cloud</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2563eb; }
        .link-box { background: #0f172a; padding: 0.75rem; border-radius: 0.5rem; word-break: break-all; font-family: monospace; font-size: 0.85rem; color: #38bdf8; margin: 1rem 0; max-height: 100px; overflow-y: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Pantalla 1: Crear Pregunta -->
        <div id="pantalla-crear" class="hidden">
            <h2>Crea tu pregunta 📝</h2>
            <input type="text" id="input-pregunta" placeholder="Ej: ¿Qué opinas de mí en una palabra?" autocomplete="off">
            <button onclick="crearPregunta()">Generar Enlace</button>
        </div>

        <!-- Pantalla 2: Enlace Generado -->
        <div id="pantalla-enlace" class="hidden">
            <h2>¡Enlace listo! 🚀</h2>
            <p>Comparte este enlace con tus amigos:</p>
            <div class="link-box" id="texto-enlace"></div>
            <button onclick="copiarEnlace()">Copiar Enlace</button>
        </div>

        <!-- Pantalla 3: Responder -->
        <div id="pantalla-responder" class="hidden">
            <h2>Responde la pregunta 🤔</h2>
            <p id="pregunta-texto" style="font-size: 1.1rem; color: #38bdf8;"></p>
            <textarea id="input-respuesta" rows="3" placeholder="Escribe tu respuesta aquí..."></textarea>
            <button onclick="enviarRespuesta()">Enviar respuesta</button>
        </div>

        <!-- Pantalla 4: Ver Respuesta (Dueño) -->
        <div id="pantalla-resultado" class="hidden">
            <h2>Respuesta Recibida 🎯</h2>
            <p id="pregunta-mostrada"></p>
            <div class="link-box" id="caja-respuesta" style="color: #4ade80;"></div>
            <button onclick="location.href = window.location.pathname">Crear otra pregunta</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('d');
        const respParam = urlParams.get('r');

        function iniciar() {
            if (respParam) {
                // Alguien ya respondió y regresó el enlace al creador
                document.getElementById('pantalla-resultado').classList.remove('hidden');
                try {
                    const datos = JSON.parse(atob(respParam));
                    document.getElementById('pregunta-mostrada').innerHTML = `<strong>Pregunta:</strong> ${datos.p}`;
                    document.getElementById('caja-respuesta').innerText = datos.r;
                } catch(e) {
                    document.getElementById('caja-respuesta').innerText = "Error al leer la respuesta.";
                }
            } else if (dataParam) {
                // Alguien abrió el enlace para responder
                document.getElementById('pantalla-responder').classList.remove('hidden');
                try {
                    const preguntaDecodificada = decodeURIComponent(escape(window.atob(dataParam)));
                    document.getElementById('pregunta-texto').innerText = preguntaDecodificada;
                } catch(e) {
                    document.getElementById('pregunta-texto').innerText = "Pregunta no válida.";
                }
            } else {
                // Pantalla principal para crear
                document.getElementById('pantalla-crear').classList.remove('hidden');
            }
        }

        function crearPregunta() {
            const pregunta = document.getElementById('input-pregunta').value.trim();
            if (!pregunta) return alert('Escribe una pregunta');

            // Codificar la pregunta de forma segura para la URL
            const preguntaBase64 = btoa(unescape(encodeURIComponent(pregunta)));
            const enlace = `${window.location.origin}${window.location.pathname}?d=${preguntaBase64}`;

            document.getElementById('texto-enlace').innerText = enlace;
            document.getElementById('pantalla-crear').classList.add('hidden');
            document.getElementById('pantalla-enlace').classList.remove('hidden');
        }

        function copiarEnlace() {
            const texto = document.getElementById('texto-enlace').innerText;
            navigator.clipboard.writeText(texto);
            alert('¡Enlace copiado al portapapeles!');
        }

        function enviarRespuesta() {
            const respuesta = document.getElementById('input-respuesta').value.trim();
            if (!respuesta) return alert('Escribe una respuesta');

            const preguntaActual = document.getElementById('pregunta-texto').innerText;
            
            // Empaquetar pregunta y respuesta en un JSON cifrado para enviarlo de vuelta al creador
            const paquete = JSON.stringify({ p: preguntaActual, r: respuesta });
            const paqueteBase64 = btoa(unescape(encodeURIComponent(paquete)));
            
            // Redirige al usuario a una vista donde el creador podrá ver la respuesta
            const enlaceRetorno = `${window.location.origin}${window.location.pathname}?r=${paqueteBase64}`;
            
            // Copiar el enlace de respuesta para que se lo mande al creador o abrirlo directamente
            prompt("¡Respuesta guardada! Copia este enlace y envíaselo a quien te hizo la pregunta:", enlaceRetorno);
            alert('¡Gracias por responder!');
            window.location.href = window.location.pathname;
        }

        iniciar();
    </script>
</body>
</html>
